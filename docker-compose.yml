services:
  db:
    image: postgres:17
    container_name: postgres_events
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_events_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h db || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_events
    restart: always
    env_file:
      - .env
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_events_data:/var/lib/pgadmin

  web:
    build: .
    container_name: backend_events
    command: >
            sh -c "python manage.py wait_for_db
            && python manage.py migrate
            && uvicorn event_manager.asgi:application --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_events_data:
  pgadmin_events_data: